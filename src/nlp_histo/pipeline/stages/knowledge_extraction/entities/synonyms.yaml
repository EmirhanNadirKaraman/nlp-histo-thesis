# Entity synonym dictionary for the NORMALIZE stage.
#
# Keys are lowercase surface forms as they appear in LLM output.
# Values are the canonical names used throughout the pipeline.
#
# Resolution order in normalize_stage.py:
#   1. This file (highest priority — domain knowledge beats the linker)
#   2. UMLS linker (scispaCy en_core_sci_lg, threshold 0.85)
#   3. Identity fallback
#
# Add new entries here as new papers are processed.
# No code changes needed — the file is reloaded on each pipeline run.

# ── Survival endpoints ─────────────────────────────────────────────────────────
