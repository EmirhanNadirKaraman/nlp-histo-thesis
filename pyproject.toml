[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-histo"
version = "0.1.0"
# Supported runtime window, 3.10–3.12 — not merely the minimum syntax level.
# Floor (>=3.10), three ways: langchain / langchain-core / torch declare
# Requires-Python >= 3.10, and the Pydantic schemas in
# pipeline/stages/knowledge_extraction/models.py use PEP-604 unions (`str | None`),
# which Pydantic evaluates at class-creation time even under
# `from __future__ import annotations`.
# Ceiling (<3.13): scispacy declares Requires-Python <3.13, and the UMLS/NER path
# depends on it — so 3.13+ is not a supported runtime for this project.
# Dependencies are NOT declared here: requirements.txt remains the tested dependency
# source of truth, so install with
# `pip install -r requirements.txt` then `pip install -e . --no-deps`.
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
# `pdffigures2/` is a gitignored, vendored third-party tool; its own eval
# tests are not part of this project's suite and fail to import here.
# The rest of the list restores pytest's built-in defaults (overriding
# `norecursedirs` replaces them).
norecursedirs = ["pdffigures2", "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}"]

[tool.ruff]
# Non-project / vendored / dead trees — not part of this codebase's lint surface.
extend-exclude = [
    ".agents",               # Claude Code skill scripts (not project code)
    "legacy",                # quarantined superseded pipeline
    "pdffigures2",           # vendored third-party tool (gitignored)
    "eval/silver/old_files", # dead earlier sweep drivers
    "notebooks",
]

[tool.ruff.lint.per-file-ignores]
# scripts/, eval/, and one-off tests bootstrap sys.path before importing the
# project packages (documented pattern in CLAUDE.md — the `from pipeline...`
# imports MUST follow `sys.path.insert(...)`), which necessarily trips E402.
# Library code under pipeline/parsers/database/ does NOT get this pass, so a
# genuine "statement before import" there still surfaces (e.g. entity_linker.py).
"scripts/**" = ["E402"]
"eval/**" = ["E402"]
"tests/**" = ["E402"]

[tool.setuptools.packages.find]
where = ["."]
# Whitelist — everything else (eval, scripts, tests, legacy, reports, docs, out)
# is excluded by omission. `eval` is deliberately NOT installed: it is run as
# `python -m eval.…` from the repository root (installing a top-level package
# literally named `eval` would be a generic-name collision), and
# eval/silver/old_files/ has no __init__.py, so packages.find would silently drop it.
include = ["pipeline*", "database*", "parsers*", "named_entity_recognition*"]

[tool.setuptools.package-data]
# synonyms.yaml is the only non-Python file loaded at runtime from an installed
# package (pipeline/stages/knowledge_extraction/stages/normalize_stage.py:41, read at
# import). configs/*.yaml stay OUT: they live outside every package and are read
# repo-root-relative, which the supported editable install resolves correctly.
"pipeline.stages.knowledge_extraction.entities" = ["synonyms.yaml"]
