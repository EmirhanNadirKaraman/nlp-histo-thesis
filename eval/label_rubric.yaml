# Label → (crop, caption, footnote, mask) rubric.
#
# Four scoring dimensions per label:
#   crop     — figure/table output correctness (the emitted crop bbox).
#   caption  — caption-attachment correctness (precision-only).
#   footnote — footnote-inclusion correctness (precision-only, tables).
#   mask     — masking / text-safety correctness.  Recall denominator uses
#              missed_figures / missed_tables from eval/ground_truth.csv.
#
# Each label string maps to four per-dimension scores in [0.0, 1.0].
# Special tokens:
#   "n/a"  → that dimension does NOT apply to this label (item excluded from
#            that dim's TP/FP denominator).  Use for "not a table at all"
#            labels — caption/footnote correctness is meaningless then.
#   "skip" → exclude the entire item from this dim's denominator (use for
#            ambiguous "needs check" labels that aren't a decision).
#
# Each label maps to exactly one (crop, caption, footnote) tuple via
# direct lookup or longest-prefix match.  No automatic combination —
# if you want a multi-failure semantic (e.g. "wrong caption AND missing
# footnotes"), add an explicit entry for that label string here.
#
# Adjust these to recompute F1 under different assumptions.  The scorer
# stamps the active rubric path into the JSON report so the numbers are
# reproducible.

labels:
  # ── Standard single-keystroke outcomes ────────────────────────────────────
  correct:
    crop: 1.0
    caption: 1.0
    footnote: 1.0
    mask: 1.0

  incorrect:
    crop: 0.0          # not a table at all
    caption: n/a
    footnote: n/a
    mask: 0.0          # shouldn't have been masked either (random paragraph FP)

  # Icons get masked correctly (they ARE image-like regions whose content
  # would otherwise leak into body text), but they shouldn't appear in the
  # figure output.  crop=0 (figure-output FP), mask=1 (text-safety OK).
  icon:
    crop: 0.0
    caption: n/a
    footnote: n/a
    mask: 1.0

  other:
    crop: skip
    caption: skip
    footnote: skip
    mask: skip

  # ── Custom-label outcomes (typed via [l] in the annotator) ────────────────
  wrong caption:
    crop: 1.0
    caption: 0.0
    footnote: 1.0
    mask: 1.0          # region was masked correctly; caption mismatch is downstream

  missing footnotes:
    crop: 1.0
    caption: 1.0
    footnote: 0.0
    mask: 1.0          # table region masked; footnote omission affects crop completeness only

  # Crop too big → over-masks (loses some adjacent text).
  # Crop too small → under-masks (table cells leak into body text).
  crop is too big:
    crop: 0.75
    caption: 1.0
    footnote: 1.0
    mask: 0.75         # over-mask: covers more than needed but no leak
  crop is too small:
    crop: 0.25
    caption: 1.0
    footnote: 1.0
    mask: 0.25         # under-mask: table content leaks into body text

  # Discovered FP class — filter (drop_tables_inside_figures) catches these.
  # The containing figure WAS masked correctly though.
  table_in_figure:
    crop: 0.0
    caption: n/a
    footnote: n/a
    mask: 1.0

  # Inspector-only — exclude from all dims; flag for re-review.
  weird:
    crop: skip
    caption: skip
    footnote: skip
    mask: skip

  # ── Legacy / phrased table labels ─────────────────────────────────────────
  # These appear in pre-existing annotation files with subtle wording
  # variations.  Map them to the appropriate semantics so they don't
  # silently prefix-match "correct" and inflate F1.


  # Two-failure case: missed one real table AND the crop boundary is
  # oversized because it tried to cover both.  Conservative scoring:
  # the crop captures the wrong table, so crop = under-correct (0.25)
  # and the masking only covers the captured region.
  missed table 3, table crop too big if only for table 4:
    crop: 0.25
    caption: 0.0
    footnote: n/a
    mask: 0.5

  # ── Figure-specific labels ────────────────────────────────────────────────
  # Figures don't carry body footnotes (they have captions only), so the
  # footnote dimension is always n/a for figure labels.  Longest-prefix
  # matching means specific entries below win over generic "correct figure",
  # which in turn wins over bare "correct".

  correct figure, no caption (caption in another page):
    crop: 1.0
    caption: 0.0      # caption sits on a different page → not attached
    footnote: n/a
    mask: 1.0

  correct figure, no caption (caption is in another page):   # spelling variant
    crop: 1.0
    caption: 0.0
    footnote: n/a
    mask: 1.0

  correct figure, partial caption:
    crop: 1.0
    caption: 0.5      # caption truncated — half credit
    footnote: n/a
    mask: 1.0

  correct figure, wrong caption:    # any "correct figure, wrong caption (...)"
    crop: 1.0
    caption: 0.0
    footnote: n/a
    mask: 1.0

  correct-ish figure, caption not detected, caption in crop??:
    crop: 0.75        # "correct-ish" — slight boundary issue
    caption: 0.5      # uncertain
    footnote: n/a
    mask: 0.75        # boundary off → slight mask precision loss

  correct figure:    # bare prefix — any "correct figure, ..." not matched above
    crop: 1.0
    caption: 1.0
    footnote: n/a
    mask: 1.0

  # ── Auto-added via --review-unknown (2026-05-18) ────────────────────────
  # Variants of "correct figure, wrong caption" where the caption-attacher
  # picked up page-footer text instead of the real caption.  Figure crop
  # itself is fine; figures don't carry footnotes → n/a.
  'correct figure, wrong caption (real caption is in bottom left, confused page footer with caption)':
    crop: 1.0
    caption: 0.0
    footnote: n/a
    mask: 1.0

  'correct figure, wrong caption (real caption is in bottom right, confused page footer with caption)':
    crop: 1.0
    caption: 0.0
    footnote: n/a
    mask: 1.0

  # Table crop is fine but no caption was attached at all.
  'missed caption':
    crop: 1.0
    caption: 0.0
    footnote: 1.0
    mask: 1.0

  # Inspector-only — defer scoring entirely.
  'weird crop? check later':
    crop: skip
    caption: skip
    footnote: skip
    mask: skip

  # Caption-attacher pulled footnote text up as the caption — both the
  # caption AND footnote dims are wrong.  Crop + mask still OK.
  'wrong caption (footnotes matched to captions)':
    crop: 1.0
    caption: 0.0
    footnote: 0.0
    mask: 1.0


  # ── Restored aliases (revert of premature merge) ────────────────────────
  'wrong caption (footnotes matched to captions, rotated image)':
    crop: 1.0
    caption: 0.0
    footnote: 0.0
    mask: 1.0
